# Tests and style checks on every push. The VM serves whatever reaches master
# within a minute, so a red mark here is the warning before (or right after) it goes live.
name: CI

# Every branch on push (a pull request shows the run of its branch's last commit), or by hand.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests and style (Prettier, ESLint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
